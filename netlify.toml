# ROBOS MDP — Configuración de deploy GitHub/Netlify
[build]
  publish = "robosmdp"
  # Sitio estático: el HTML ya está armado en robosmdp/, no hay paso de build.
  # Definimos un command no-op para anular cualquier build command heredado del
  # dashboard (p.ej. "npm run build", que no existe y rompía el deploy con exit 2).
  # Netlify igual instala dependencies y bundlea las functions: eso no depende de este command.
  command = "echo 'Sitio estatico: sin paso de build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # firebase-admin no se bundlea bien con esbuild (require dinámicos + deps nativas
  # opcionales): esbuild lo rompe y la función tira 502 al cargar. Marcándolo como
  # external, Netlify lo copia tal cual desde node_modules en vez de bundlearlo.
  external_node_modules = ["firebase-admin"]
