<script>
// ===== FIREBASE =====
const FB_CONFIG={
  apiKey:"AIzaSyCm2rB0jOpvoi_wLpxVSMk0nip1pR62mjo",
  authDomain:"robosmdp-d1ef3.firebaseapp.com",
  projectId:"robosmdp-d1ef3",
  storageBucket:"robosmdp-d1ef3.firebasestorage.app",
  messagingSenderId:"329992862097",
  appId:"1:329992862097:web:be1166da8fe9380df2c230"
};
let db=null;
if(window.firebase){ firebase.initializeApp(FB_CONFIG); db=firebase.firestore(); }

const G={ foro:[], foroQuery:'', curThread:null, foroReplyUnsub:null, foroPhoto:null, foroReplyPhoto:null };

// ===== UTILS =====
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openIV(src){ const im=document.getElementById('iv-img'),iv=document.getElementById('iv'); if(im&&iv){ im.src=src; iv.style.display='flex'; } }
function closeIV(){ const iv=document.getElementById('iv'); if(iv) iv.style.display='none'; }
// Compresión de foto (mismo sistema que el resto del sitio: canvas 800px, 72%)
function prevForoPhoto(input,which){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=800; let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.72);
      const reply=which==='reply';
      if(reply) G.foroReplyPhoto=compressed; else G.foroPhoto=compressed;
      const prev=document.getElementById(reply?'foro-reply-ph-prev':'foro-ph-prev');
      const imgEl=document.getElementById(reply?'foro-reply-ph-img':'foro-ph-img');
      if(prev&&imgEl){ imgEl.src=compressed; prev.style.display='block'; }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function rmForoPhoto(which){
  const reply=which==='reply';
  if(reply) G.foroReplyPhoto=null; else G.foroPhoto=null;
  const prev=document.getElementById(reply?'foro-reply-ph-prev':'foro-ph-prev'); if(prev) prev.style.display='none';
  const inp=document.getElementById(reply?'foro-reply-photo':'foro-photo'); if(inp) inp.value='';
}
function tAgo(date){
  const d=Math.floor((Date.now()-date.getTime())/1000);
  if(d<0) return 'recién';
  if(d<60) return 'hace '+d+'s';
  if(d<3600) return 'hace '+Math.floor(d/60)+'min';
  if(d<86400) return 'hace '+Math.floor(d/3600)+'h';
  return 'hace '+Math.floor(d/86400)+'d';
}
function safeIcons(){ try{ if(window.lucide&&lucide.createIcons) lucide.createIcons(); }catch(e){} }
function showToast(msg,type){
  const c=document.getElementById('toast-c'),t=document.createElement('div');
  t.className='toast'; t.style.borderLeftColor=type==='r'?'#ef4444':'#22c55e';
  t.innerHTML='<i data-lucide="'+(type==='r'?'alert-circle':'check-circle')+'" style="width:16px;height:16px;color:'+(type==='r'?'#ef4444':'#22c55e')+'"></i> '+esc(msg);
  c.appendChild(t); safeIcons(); setTimeout(()=>t.remove(),4000);
}

// ===== APODO (compartido con el sitio: localStorage rmdp_apodo) =====
const APODO_LS='rmdp_apodo', ADMIN_NAME='AdminRobos';
function isAdminUser(){ return false; } // foro público: sin login admin
function isReservedName(s){
  const n=String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  return !!n && (n.indexOf('admin')>=0||n.indexOf('robosmdp')>=0||n.indexOf('verificad')>=0||n.indexOf('oficial')>=0);
}
function verifiedBadge(){ return '<span title="Cuenta verificada · Robos MDP" style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:#3b82f6;color:#fff;border-radius:50%;font-size:9px;font-weight:900;line-height:1;margin-left:4px;vertical-align:middle;flex-shrink:0">✓</span>'; }
function vbadge(o){ return (o&&o.admin)?verifiedBadge():''; }
function authorFields(){ return {apodo:ensureApodo(),admin:false}; }
function getApodo(){ try{ return (localStorage.getItem(APODO_LS)||'').trim(); }catch(e){ return ''; } }
function setApodo(n){ n=String(n||'').trim().slice(0,40); if(isReservedName(n)) return; try{ localStorage.setItem(APODO_LS,n); }catch(e){} }
function promptApodo(initial){
  for(let i=0;i<4;i++){
    const a=(window.prompt(i===0?'¿Cómo querés que te llamen?':'Ese nombre está reservado. Elegí otro:',initial||'')||'').trim().slice(0,40);
    if(!a) return '';
    if(isReservedName(a)){ showToast('Ese nombre está reservado','r'); initial=''; continue; }
    return a;
  }
  return '';
}
function ensureApodo(){ let a=getApodo(); if(!a){ a=promptApodo(''); if(a){ setApodo(a); refreshApodoLabels(); } } return a||'Vecino anónimo'; }
function apodoWhoHTML(){
  const a=getApodo();
  return (a?'Como <strong style="color:var(--t2)">'+esc(a)+'</strong> · ':'')+
    '<a onclick="changeApodo()" style="color:#818cf8;cursor:pointer;text-decoration:underline">'+(a?'Cambiar':'Elegí un apodo')+'</a>';
}
function refreshApodoLabels(){ document.querySelectorAll('.apodo-who').forEach(el=>{ el.innerHTML=apodoWhoHTML(); }); }
// Avatar circular generado desde la inicial del apodo (color estable por hash del nombre)
function foroColor(s){ s=String(s||'?'); let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return 'hsl('+(h%360)+',52%,46%)'; }
function foroAvatar(name,size){ size=size||36; const n=(String(name||'').trim())||'?'; const ini=n.charAt(0).toUpperCase(); return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+foroColor(n)+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:'+Math.round(size*.42)+'px;flex-shrink:0;font-family:\'Space Grotesk\',sans-serif;line-height:1">'+esc(ini)+'</div>'; }
// Contador de caracteres del input de respuesta (se pone rojo > 90%)
function foroReplyCount(){ const ta=document.getElementById('foro-reply-in'), c=document.getElementById('foro-reply-count'); if(!ta||!c) return; const max=1000, n=ta.value.length; c.textContent=n+' / '+max+' caracteres'; c.classList.toggle('over', n>max*0.9); }
function changeApodo(){ const a=promptApodo(getApodo()); if(a) setApodo(a); refreshApodoLabels(); }

// ===== FORO =====
const FORO_COL='foro';
function foroDate(x){ const v=x&&x.timestamp; if(v&&v.toDate) return v.toDate(); if(v&&typeof v.seconds==='number') return new Date(v.seconds*1000); return new Date(0); }
function cmTime(c){ const v=c.timestamp; return (v&&v.toDate)?v.toDate():null; }
async function loadForo(){
  try{
    const snap=await db.collection(FORO_COL).limit(300).get();
    G.foro=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>foroDate(b)-foroDate(a));
  }catch(e){ console.warn('loadForo',e); G.foro=[]; }
  renderForo();
}
function onForoSearch(){ G.foroQuery=(document.getElementById('foro-search')?.value||'').toLowerCase().trim(); renderForo(); }
function foroFiltered(){
  let list=(G.foro||[]).slice();
  const q=G.foroQuery;
  if(q) list=list.filter(t=>String(t.titulo||'').toLowerCase().includes(q)||String(t.cuerpo||'').toLowerCase().includes(q));
  return list;
}
function renderForo(){
  const el=document.getElementById('foro-list'); if(!el) return;
  const list=foroFiltered();
  if(!list.length){ el.innerHTML='<div style="text-align:center;padding:46px 0;color:#475569;font-size:12px;font-weight:700"><div style="font-size:34px;margin-bottom:8px">💬</div>'+(G.foroQuery?'Sin resultados para "'+esc(G.foroQuery)+'"':'No hay temas todavía. ¡Creá el primero!')+'</div>'; return; }
  const now=Date.now();
  el.innerHTML=list.map(t=>{
    const d=foroDate(t), nuevo=(now-d.getTime())<864e5 && d.getTime()>0;
    const preview=String(t.cuerpo||'').slice(0,140);
    const rc=t.respuestas_count||0;
    const thumb=t.photoBase64?'<img src="'+t.photoBase64+'" alt="" style="width:60px;height:60px;border-radius:11px;object-fit:cover;flex-shrink:0;border:1px solid rgba(var(--rgb-line),.2)">':'';
    return '<div onclick="openThread(\''+t.id+'\')" style="background:linear-gradient(160deg,rgba(var(--rgb-slate),.6),rgba(var(--rgb-deep),.7));border:1px solid rgba(var(--rgb-line),.14);border-left:4px solid #6366f1;border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:flex-start">'+
      foroAvatar(t.apodo,40)+
      '<div style="min-width:0;flex:1">'+
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">'+
        (nuevo?'<span class="foro-new-badge" style="font-size:8px;font-weight:800;background:rgba(99,102,241,.2);color:#a5b4fc;padding:2px 8px;border-radius:999px;text-transform:uppercase">Nuevo</span>':'')+
        '<span style="font-size:14px;font-weight:800;color:var(--t0);line-height:1.3">'+esc(t.titulo||'(sin título)')+'</span></div>'+
      '<p style="font-size:9px;color:var(--t3);font-weight:600;margin-bottom:7px"><strong style="color:var(--t2)">'+esc(t.apodo||'Vecino anónimo')+'</strong>'+vbadge(t)+''+(d.getTime()>0?' · '+tAgo(d):'')+'</p>'+
      (preview?'<p style="font-size:12px;color:var(--t2);line-height:1.5">'+esc(preview)+(t.cuerpo&&t.cuerpo.length>140?'…':'')+'</p>':'')+
      '<p style="font-size:10px;color:#818cf8;font-weight:700;margin-top:9px">💬 '+rc+' '+(rc===1?'respuesta':'respuestas')+'</p>'+
      '</div>'+thumb+'</div>';
  }).join('');
}
function openForoM(){
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v;};
  set('foro-title',''); set('foro-body','');
  rmForoPhoto('new');
  const err=document.getElementById('foro-err'); if(err) err.style.display='none';
  refreshApodoLabels();
  document.getElementById('foro-m').style.display='flex';
  safeIcons();
}
function closeForoM(){ document.getElementById('foro-m').style.display='none'; }
async function submitThread(){
  const titulo=(document.getElementById('foro-title')?.value||'').trim();
  const cuerpo=(document.getElementById('foro-body')?.value||'').trim();
  if(titulo.length<3||!cuerpo){ const e=document.getElementById('foro-err'); if(e) e.style.display='block'; return; }
  const a=authorFields();
  const sub=document.getElementById('foro-sub'); if(sub){ sub.disabled=true; sub.textContent='Publicando...'; sub.style.opacity='.7'; }
  try{
    await db.collection(FORO_COL).add({
      titulo:titulo.slice(0,100), cuerpo:cuerpo.slice(0,1000), apodo:a.apodo, admin:a.admin,
      photoBase64:G.foroPhoto||'',
      timestamp:firebase.firestore.FieldValue.serverTimestamp(), respuestas_count:0,
    });
    closeForoM(); showToast('¡Tema publicado! 💬','g'); loadForo();
  }catch(e){ console.error('submitThread',e); showToast('No se pudo publicar (¿reglas Firestore?)','r'); }
  finally{ if(sub){ sub.disabled=false; sub.textContent='Publicar tema'; sub.style.opacity='1'; } }
}
function openThread(id){
  const t=(G.foro||[]).find(x=>x.id===id); if(!t) return;
  G.curThread=t;
  const d=foroDate(t);
  document.getElementById('foro-thread-body').innerHTML=
    '<div style="background:linear-gradient(160deg,rgba(var(--rgb-slate),.6),rgba(var(--rgb-deep),.7));border:1px solid rgba(var(--rgb-line),.14);border-radius:16px;padding:18px 20px">'+
    '<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">'+foroAvatar(t.apodo,42)+'<div style="min-width:0;flex:1">'+
    '<h3 style="font-size:18px;font-weight:800;color:var(--t0);line-height:1.25;margin-bottom:5px">'+esc(t.titulo||'(sin título)')+'</h3>'+
    '<p style="font-size:10px;color:var(--t3);font-weight:600"><strong style="color:var(--t2)">'+esc(t.apodo||'Vecino anónimo')+'</strong>'+vbadge(t)+''+(d.getTime()>0?' · '+tAgo(d):'')+'</p>'+
    '</div></div>'+
    '<p style="font-size:13px;color:var(--t1);line-height:1.6;white-space:pre-wrap">'+esc(t.cuerpo||'')+'</p>'+
    (t.photoBase64?'<img src="'+t.photoBase64+'" alt="" onclick="openIV(this.src)" style="margin-top:12px;max-width:100%;max-height:340px;border-radius:12px;object-fit:contain;cursor:zoom-in;display:block">':'')+
    '</div>';
  refreshApodoLabels();
  rmForoPhoto('reply');
  const rin=document.getElementById('foro-reply-in'); if(rin) rin.value='';
  foroReplyCount();
  document.getElementById('foro-thread-p').style.display='flex';
  openReplies(id);
  safeIcons();
}
function closeThread(){
  document.getElementById('foro-thread-p').style.display='none';
  if(G.foroReplyUnsub){ try{G.foroReplyUnsub();}catch(e){} G.foroReplyUnsub=null; }
  G.curThread=null;
}
function repliesRef(tid){ return db.collection(FORO_COL).doc(tid).collection('respuestas'); }
function openReplies(tid){
  if(G.foroReplyUnsub){ try{G.foroReplyUnsub();}catch(e){} G.foroReplyUnsub=null; }
  try{
    G.foroReplyUnsub=repliesRef(tid).orderBy('timestamp','asc').onSnapshot(snap=>{
      const list=document.getElementById('foro-reply-list'), cnt=document.getElementById('foro-reply-cnt');
      if(cnt) cnt.textContent=snap.size;
      if(!list) return;
      if(snap.empty){ list.innerHTML='<p style="font-size:11px;color:var(--t3);font-style:italic">Todavía no hay respuestas. ¡Sé el primero!</p>'; return; }
      list.innerHTML=snap.docs.map(d=>{ const c=d.data(), t=cmTime(c);
        return '<div style="background:rgba(var(--rgb-slate),.5);border:1px solid rgba(var(--rgb-line),.14);border-radius:12px;padding:11px 14px;display:flex;gap:10px">'+
          foroAvatar(c.apodo,32)+'<div style="min-width:0;flex:1">'+
          '<p style="font-size:9px;color:var(--t3);font-weight:700;margin-bottom:3px"><strong style="color:var(--t2)">'+esc(c.apodo||'Vecino anónimo')+'</strong>'+vbadge(c)+''+(t?' · '+tAgo(t):'')+'</p>'+
          '<p style="font-size:13px;color:var(--t1);line-height:1.5;white-space:pre-wrap">'+esc(c.texto||'')+'</p>'+
          (c.photoBase64?'<img src="'+c.photoBase64+'" alt="" onclick="openIV(this.src)" style="margin-top:8px;max-width:200px;max-height:200px;border-radius:10px;object-fit:cover;cursor:zoom-in;display:block">':'')+
          '</div></div>';
      }).join('');
    },err=>{ console.warn('respuestas',err); });
  }catch(e){ console.warn('openReplies',e); }
}
async function submitReply(){
  const tid=G.curThread&&G.curThread.id; if(!tid) return;
  const ta=document.getElementById('foro-reply-in'); if(!ta) return;
  const txt=ta.value.trim(); if(!txt&&!G.foroReplyPhoto) return;
  const a=authorFields();
  ta.disabled=true;
  try{
    await repliesRef(tid).add({apodo:a.apodo,admin:a.admin,texto:txt.slice(0,1000),photoBase64:G.foroReplyPhoto||'',timestamp:firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection(FORO_COL).doc(tid).update({respuestas_count:firebase.firestore.FieldValue.increment(1)});
    const t=(G.foro||[]).find(x=>x.id===tid); if(t) t.respuestas_count=(t.respuestas_count||0)+1;
    ta.value=''; foroReplyCount(); rmForoPhoto('reply'); renderForo();
  }catch(e){ console.error('submitReply',e); showToast('No se pudo responder (¿reglas Firestore?)','r'); }
  finally{ ta.disabled=false; }
}

// ===== INIT =====
window.addEventListener('load',()=>{
  loadForo();
  refreshApodoLabels();
  safeIcons();
});
</script>
</body>
</html>
