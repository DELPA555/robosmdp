<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cambiar contraseña — Robos MDP</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e1a">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--surface:#141d30;--surface-2:#1a2438;--line:rgba(148,163,184,.16);
  --t0:#f1f5f9;--t1:#e2e8f0;--t2:#cbd5e1;--t3:#94a3b8;--accent:#0ea5e9;--accent-2:#0284c7;
  --ok:#22c55e;--err:#ef4444;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t1);line-height:1.5;min-height:100vh;
  background-image:radial-gradient(800px circle at 50% -10%,rgba(14,165,233,.12),transparent 55%)}
.wrap{max-width:400px;margin:40px auto 0;padding:22px 16px 60px}
.head{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:20px}
h1{font-size:19px;font-weight:700;color:var(--t0);letter-spacing:-.02em}
.card{background:linear-gradient(170deg,rgba(26,36,56,.6),rgba(13,20,36,.65));border:1px solid var(--line);border-radius:16px;padding:20px 18px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--t3);margin:0 0 6px}
.field{margin-bottom:14px}
input{width:100%;background:#0c1322;border:1px solid var(--line);color:var(--t0);border-radius:10px;padding:11px 12px;font-size:15px;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
input:read-only{opacity:.7;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px 16px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04110c;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--t1)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{font-size:13px;min-height:18px;margin-top:10px}
.msg.err{color:var(--err)} .msg.ok{color:#86efac}
.hint{font-size:11.5px;color:var(--t3);margin-top:4px}
.done{text-align:center;padding:14px 4px}
.done .big{font-size:44px;margin-bottom:8px}
.done h2{font-size:18px;color:var(--t0);margin-bottom:16px}
a.back{display:inline-block;margin-top:18px;color:#38bdf8;text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">🛡️</div><h1>Cambiar contraseña</h1></div>

  <div class="card" id="form-view">
    <div class="field">
      <label for="email">Tu cuenta</label>
      <input id="email" type="email" readonly value="…">
    </div>
    <div class="field">
      <label for="actual">Contraseña actual</label>
      <input id="actual" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="field">
      <label for="nueva">Nueva contraseña</label>
      <input id="nueva" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      <div class="hint">Al menos 8 caracteres.</div>
    </div>
    <div class="field">
      <label for="repetir">Repetir nueva contraseña</label>
      <input id="repetir" type="password" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button class="btn" id="btn" onclick="cambiar()">Cambiar contraseña</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card done" id="done-view" style="display:none">
    <div class="big">✓</div>
    <h2>Contraseña actualizada correctamente</h2>
    <a class="btn ghost" href="panel-organismos.html" style="text-decoration:none">Volver al panel</a>
  </div>

  <div style="text-align:center"><a class="back" href="panel-organismos.html">← Volver al panel</a></div>
</div>

<!-- Firebase (compat, misma versión del sitio) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
// Config pública del sitio (misma que chat.html / index.html).
const FB_CONFIG={
  apiKey:"AIzaSyCm2rB0jOpvoi_wLpxVSMk0nip1pR62mjo",
  authDomain:"robosmdp-d1ef3.firebaseapp.com",
  projectId:"robosmdp-d1ef3",
  storageBucket:"robosmdp-d1ef3.firebasestorage.app",
  messagingSenderId:"329992862097",
  appId:"1:329992862097:web:be1166da8fe9380df2c230"
};

let auth=null;
try{ firebase.initializeApp(FB_CONFIG); auth=firebase.auth(); }catch(e){ console.error('Firebase init', e); }

const $=id=>document.getElementById(id);
function say(t,cls){ const m=$('msg'); m.textContent=t||''; m.className='msg'+(cls?(' '+cls):''); }

let user=null;
if(auth) auth.onAuthStateChanged(u=>{
  if(!u){ location.replace('panel-organismos.html'); return; } // sin sesión → al panel
  user=u;
  $('email').value=u.email||'';
});

async function cambiar(){
  if(!user){ location.replace('panel-organismos.html'); return; }
  const actual=$('actual').value, nueva=$('nueva').value, repetir=$('repetir').value;
  if(!actual){ say('Ingresá tu contraseña actual.','err'); return; }
  if(nueva.length<8){ say('La nueva contraseña debe tener al menos 8 caracteres.','err'); return; }
  if(nueva!==repetir){ say('Las contraseñas nuevas no coinciden.','err'); return; }
  if(nueva===actual){ say('La nueva contraseña debe ser distinta de la actual.','err'); return; }

  $('btn').disabled=true; say('Actualizando…','ok');
  try{
    // Firebase exige reautenticación reciente para cambiar la contraseña.
    const cred=firebase.auth.EmailAuthProvider.credential(user.email, actual);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(nueva);
    $('form-view').style.display='none';
    $('done-view').style.display='block';
  }catch(e){
    console.error('cambiar', e);
    let m='No se pudo cambiar la contraseña.';
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') m='La contraseña actual es incorrecta.';
    else if(e.code==='auth/weak-password') m='La nueva contraseña es demasiado débil (mínimo 8 caracteres).';
    else if(e.code==='auth/too-many-requests') m='Demasiados intentos. Esperá un momento y reintentá.';
    else if(e.code==='auth/requires-recent-login') m='Por seguridad, volvé a iniciar sesión y reintentá.';
    say(m,'err');
    $('btn').disabled=false;
  }
}
</script>
</body>
</html>
