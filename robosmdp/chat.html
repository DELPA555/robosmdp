<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chat vecinal — Robos MDP · Mar del Plata</title>
<meta name="description" content="Chat vecinal en tiempo real de Robos MDP: hablá con otros vecinos de Mar del Plata sobre seguridad y lo que pasa en el barrio, en vivo.">
<meta name="theme-color" content="#0a0f1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1c;--bg-2:#0d1424;
  --surface:#141d30;--surface-2:#1a2438;
  --line:rgba(148,163,184,.10);--line-2:rgba(148,163,184,.16);
  --rgb-deep:15,23,42;--rgb-slate:30,41,59;--rgb-line:148,163,184;
  --bg-overlay:#0a0e1a;
  --t0:#f1f5f9;--t1:#e2e8f0;--t2:#cbd5e1;--t3:#94a3b8;
  --accent:#0ea5e9;--accent-2:#0284c7;
}
html{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg-overlay);color:var(--t1);-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;height:100vh}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.ns::-webkit-scrollbar{width:7px}
.ns::-webkit-scrollbar-thumb{background:rgba(var(--rgb-line),.25);border-radius:999px}
.ns{-webkit-overflow-scrolling:touch;overflow-y:auto}
#toast-c{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);color:var(--t1);border:1px solid var(--line-2);padding:12px 16px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:9px;animation:tin .38s cubic-bezier(.16,1,.3,1);font-size:13px;font-weight:600;border-left:4px solid}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* Layout tipo WhatsApp */
#chat-root{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg-overlay);background-image:radial-gradient(900px circle at 50% -8%,rgba(14,165,233,.14),transparent 55%),radial-gradient(700px circle at 90% 10%,rgba(2,132,199,.06),transparent 50%)}
#chat-header{flex-shrink:0;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid rgba(var(--rgb-line),.1);display:flex;align-items:center;gap:11px;background:rgba(var(--rgb-deep),.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hlogo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 16px rgba(14,165,233,.3);flex-shrink:0}
#chat-msgs{flex:1;min-height:0;padding:16px 12px 10px;display:flex;flex-direction:column;gap:9px}
.cmsg{display:flex;gap:9px;max-width:85%;align-items:flex-start}
.cmsg.mine{align-self:flex-end;flex-direction:row-reverse}
.cbubble{background:rgba(var(--rgb-slate),.55);border:1px solid rgba(var(--rgb-line),.14);border-radius:15px;padding:8px 12px;min-width:0}
.cmsg.mine .cbubble{background:rgba(14,165,233,.16);border-color:rgba(14,165,233,.3)}
.cname{font-size:11px;font-weight:800;line-height:1;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ctext{font-size:13.5px;color:var(--t1);line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-top:3px}
.ctime{font-size:9px;color:var(--t3);font-weight:600;margin-top:4px;font-family:'Space Mono',monospace}
.badge{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em;line-height:1.5}
.badge-admin{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.badge-mod{background:rgba(59,130,246,.2);color:#93c5fd;border:1px solid rgba(59,130,246,.4)}
#chat-footer{flex-shrink:0;border-top:1px solid rgba(var(--rgb-line),.1);background:rgba(var(--rgb-deep),.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#chat-who{font-size:10px;color:var(--t3);margin-bottom:7px}
.inrow{display:flex;gap:9px;align-items:flex-end}
#chat-in{flex:1;background:rgba(var(--rgb-deep),.7);border:1px solid rgba(var(--rgb-line),.2);border-radius:14px;padding:11px 13px;font-size:16px;font-weight:500;color:var(--t1);outline:none;resize:none;font-family:inherit;max-height:120px;line-height:1.4}
#chat-in:focus{border-color:rgba(14,165,233,.55)}
#chat-send{flex-shrink:0;width:46px;height:46px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(14,165,233,.35)}
#chat-send:disabled{opacity:.45;cursor:not-allowed}
#chat-count{font-size:10px;color:var(--t3);text-align:right;margin-top:5px;font-family:'Space Mono',monospace}
#chat-count.over{color:#ef4444;font-weight:700}
#chat-ban{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);border-radius:13px;padding:11px 14px;font-size:12px;font-weight:600;color:#fca5a5;line-height:1.45}
.online-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:odot 2s ease-out infinite}
@keyframes odot{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.flink{text-decoration:none}
/* Responder a un mensaje + menciones */
.cmsg{position:relative}
.reply-btn{flex-shrink:0;align-self:center;opacity:0;transition:opacity .15s;width:30px;height:30px;border-radius:50%;border:1px solid rgba(var(--rgb-line),.2);background:rgba(var(--rgb-slate),.9);color:var(--t2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}
@media (hover:hover){.cmsg:hover .reply-btn{opacity:1}}
@media (hover:none){.reply-btn{display:none}}
.cquote{border-left:3px solid var(--accent);background:rgba(var(--rgb-deep),.55);border-radius:7px;padding:5px 9px;margin-bottom:6px;cursor:pointer;max-width:100%}
.cquote .cq-name{font-size:10px;font-weight:800;color:#7dd3fc;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cquote .cq-text{font-size:11px;color:var(--t3);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cq-del{font-style:italic;color:#64748b}
.mention{color:#38bdf8;font-weight:700}
.cmsg.flash .cbubble{animation:flashb 1.4s ease-out}
@keyframes flashb{0%,35%{box-shadow:0 0 0 2px rgba(14,165,233,.65)}100%{box-shadow:0 0 0 0 rgba(14,165,233,0)}}
#reply-preview{display:none;align-items:center;gap:9px;background:rgba(var(--rgb-deep),.6);border:1px solid rgba(14,165,233,.3);border-left:3px solid var(--accent);border-radius:12px;padding:8px 11px;margin-bottom:8px}
#reply-preview .rp-body{min-width:0;flex:1}
#reply-preview .rp-name{font-size:10px;font-weight:800;color:#7dd3fc;line-height:1.35}
#reply-preview .rp-text{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;margin-top:1px}
#reply-cancel{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid rgba(var(--rgb-line),.2);background:transparent;color:var(--t3);cursor:pointer;font-size:12px;line-height:1}
#mention-dd{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:190px;overflow-y:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:13px;box-shadow:0 -10px 30px rgba(0,0,0,.45);z-index:50;padding:5px}
#mention-dd .md-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t1)}
#mention-dd .md-item.sel,#mention-dd .md-item:hover{background:rgba(14,165,233,.14)}
/* Login admin */
#chat-admin-btn{flex-shrink:0;white-space:nowrap;padding:8px 10px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;border:1px solid rgba(var(--rgb-line),.18);background:rgba(var(--rgb-slate),.7);color:var(--t3)}
#chat-admin-btn.is-admin{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.4);color:#4ade80}
#chat-notif-btn{flex-shrink:0;width:38px;height:36px;border-radius:12px;font-size:16px;cursor:pointer;border:1px solid rgba(var(--rgb-line),.18);background:rgba(var(--rgb-slate),.7);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.movl{position:fixed;inset:0;z-index:7000;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px}
.mbox{background:var(--bg-2);border:1px solid var(--line-2);width:100%;max-width:380px;border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.6);padding:20px 22px}
.min{width:100%;background:rgba(var(--rgb-deep),.65);border:1px solid rgba(var(--rgb-line),.2);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--t1);outline:none;margin-bottom:10px;font-family:inherit}
.min:focus{border-color:rgba(14,165,233,.55)}
.mbtn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.mbtn:disabled{opacity:.6;cursor:default}
.mod-actions{display:flex;gap:5px;margin-top:7px}
.mod-btn{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.5}
.mod-del{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.mod-ban{background:rgba(249,115,22,.14);color:#fdba74;border:1px solid rgba(249,115,22,.3)}
/* Pantalla de estado / suspensión (Premium V5) */
#chat-lockout{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
#chat-lockout .lk-card{max-width:420px;width:100%;background:linear-gradient(170deg,rgba(var(--rgb-slate),.55),rgba(var(--rgb-deep),.72));border:1px solid var(--line-2);border-radius:22px;padding:34px 26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#chat-lockout.suspended .lk-card{border-color:rgba(239,68,68,.4);background:linear-gradient(170deg,rgba(239,68,68,.10),rgba(var(--rgb-deep),.78))}
#chat-lockout .lk-icon{width:78px;height:78px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(var(--rgb-slate),.5);border:1px solid var(--line-2)}
#chat-lockout.suspended .lk-icon{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4)}
#chat-lockout .lk-emoji{font-size:38px;line-height:1}
#chat-lockout .lk-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(var(--rgb-line),.25);border-top-color:var(--accent);animation:lkspin .8s linear infinite}
@keyframes lkspin{to{transform:rotate(360deg)}}
#chat-lockout h3{font-size:19px;font-weight:800;color:var(--t0);letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
#chat-lockout.suspended h3{color:#fca5a5;text-transform:uppercase;letter-spacing:.01em;font-size:18px}
#chat-lockout p{font-size:13.5px;color:var(--t2);line-height:1.55}
#chat-lockout #chat-lockout-meta{margin-top:16px;display:flex;flex-direction:column;gap:9px}
#chat-lockout .lk-row{background:rgba(var(--rgb-deep),.55);border:1px solid var(--line);border-radius:12px;padding:10px 13px;text-align:left}
#chat-lockout .lk-row b{display:block;font-size:9px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
#chat-lockout .lk-row span{font-size:13px;font-weight:600;color:var(--t1);word-break:break-word}
#chat-lockout .lk-note{margin-top:15px;font-size:11px;color:var(--t3);line-height:1.5}
@media (max-width:680px){#chat-lockout{padding:20px 14px}#chat-lockout .lk-card{padding:28px 20px;border-radius:18px}#chat-lockout h3{font-size:17px}}
</style>

</head>
<body>

<div id="chat-root">
  <header id="chat-header">
    <div class="hlogo">💬</div>
    <div style="min-width:0;flex:1">
      <h2 style="font-size:15px;font-weight:700;color:var(--t0);letter-spacing:-.02em;line-height:1.1">Chat Vecinal</h2>
      <p style="font-size:10px;font-weight:600;color:var(--t3);margin-top:3px;display:flex;align-items:center;gap:6px"><span class="online-dot"></span><span id="chat-online">0 vecinos en línea</span></p>
    </div>
    <button id="chat-notif-btn" onclick="toggleNotif()" title="Notificaciones">🔕</button>
    <button id="chat-admin-btn" onclick="openAdminLogin()" title="Acceso administrador">🔐 Login admin</button>
    <a href="/" class="flink" style="padding:9px 14px;background:rgba(var(--rgb-slate),.7);border:1px solid rgba(var(--rgb-line),.16);border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;color:var(--t2);flex-shrink:0">← Volver</a>
  </header>

  <!-- Pantalla de estado / suspensión (fail-closed: visible hasta verificar acceso) -->
  <section id="chat-lockout" role="status" aria-live="polite">
    <div class="lk-card">
      <div class="lk-icon" id="lk-icon">
        <span class="lk-spin" id="lk-spin" aria-hidden="true"></span>
        <span class="lk-emoji" id="lk-emoji" style="display:none">🚫</span>
      </div>
      <h3 id="chat-lockout-title">Verificando acceso…</h3>
      <p id="chat-lockout-desc">Conectando con el chat vecinal de forma segura.</p>
      <div id="chat-lockout-meta" style="display:none"></div>
    </div>
  </section>

  <div id="chat-msgs" class="ns" style="display:none">
    <div id="chat-loadmore" style="display:none;text-align:center;margin-bottom:4px"><button onclick="loadMoreMsgs()" style="background:rgba(var(--rgb-slate),.6);border:1px solid rgba(var(--rgb-line),.18);border-radius:999px;padding:7px 16px;font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;cursor:pointer">↑ Cargar mensajes anteriores</button></div>
    <div id="chat-empty" style="text-align:center;padding:40px 10px;color:#475569;font-size:12px;font-weight:700;display:none"><div style="font-size:34px;margin-bottom:8px">💬</div>Todavía no hay mensajes. ¡Rompé el hielo!</div>
  </div>

  <footer id="chat-footer">
    <div id="chat-ban"></div>
    <div id="chat-live">
      <div id="chat-who" class="apodo-who"></div>
      <div id="reply-preview">
        <div class="rp-body"><div class="rp-name" id="rp-name"></div><div class="rp-text" id="rp-text"></div></div>
        <button id="reply-cancel" onclick="clearReply()" title="Cancelar respuesta">✕</button>
      </div>
      <div class="inrow" style="position:relative">
        <div id="mention-dd"></div>
        <textarea id="chat-in" rows="1" maxlength="280" placeholder="Escribí un mensaje..." oninput="onChatInput()" onkeydown="onChatKey(event)"></textarea>
        <button id="chat-send" onclick="sendChat()" title="Enviar"><i data-lucide="send" style="width:19px;height:19px"></i></button>
      </div>
      <div id="chat-count">0 / 280</div>
    </div>
  </footer>
</div>

<!-- Modal login admin -->
<div class="movl" id="admin-login-m" onclick="if(event.target===this)closeAdminLogin()">
  <div class="mbox">
    <p style="font-size:15px;font-weight:800;color:var(--t0);margin-bottom:3px">🔐 Acceso administrador</p>
    <p style="font-size:11px;color:var(--t3);margin-bottom:14px">Ingresá con la cuenta de administrador de Robos MDP para escribir como <strong style="color:#4ade80">AdminRobos</strong> y moderar.</p>
    <input id="admin-email" type="email" class="min" placeholder="Email" autocomplete="username" value="admin@robosmdp.com.ar">
    <input id="admin-pass" type="password" class="min" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAdminLogin()">
    <div id="admin-login-err" style="display:none;font-size:11px;font-weight:700;color:#ef4444;margin:-2px 0 10px"></div>
    <button class="mbtn" id="admin-login-btn" onclick="doAdminLogin()">Ingresar</button>
    <button onclick="closeAdminLogin()" style="width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid rgba(var(--rgb-line),.2);background:transparent;color:var(--t3);font-size:12px;font-weight:700;cursor:pointer">Cancelar</button>
  </div>
</div>

<div id="toast-c"></div>

<script>
// ===== FIREBASE (misma config del sitio — NO modificar) =====
const FB_CONFIG={
  apiKey:"AIzaSyCm2rB0jOpvoi_wLpxVSMk0nip1pR62mjo",
  authDomain:"robosmdp-d1ef3.firebaseapp.com",
  projectId:"robosmdp-d1ef3",
  storageBucket:"robosmdp-d1ef3.firebasestorage.app",
  messagingSenderId:"329992862097",
  appId:"1:329992862097:web:be1166da8fe9380df2c230"
};
let db=null, auth=null;
// App Firebase NOMBRADA e independiente ('rmdp_chat'): el login anónimo del chat
// NO interfiere con la sesión admin del portal (app por defecto en index.html).
if(window.firebase){
  const ca=firebase.apps.find(x=>x.name==='rmdp_chat')||firebase.initializeApp(FB_CONFIG,'rmdp_chat');
  db=ca.firestore();
  try{ if(firebase.auth) auth=ca.auth(); }catch(e){}
}
const FV=firebase.firestore.FieldValue;
const ADMIN_EMAIL='admin@robosmdp.com.ar';

const CHAT_COL='chat_publico', PRES_COL='chat_presencia', MOD_COL='chat_moderadores', BAN_COL='chat_bans';
const CHAT_PAGE=100, CHAT_MAX_LEN=280, COOLDOWN_MS=3000, RATE_MAX=10, RATE_WIN_MS=60000, ONLINE_TTL=90000;

// banned arranca en true (fail-closed): nadie lee/escribe hasta verificar auth + ban.
// G.mods es un Set de UIDs (los moderadores se indexan por UID, no por apodo).
const G={ limit:CHAT_PAGE, msgsUnsub:null, presUnsub:null, banUnsub:null, modUnsub:null,
  mods:new Set(), lastSend:0, sendTimes:[], banned:true, authReady:false, banReady:false,
  uid:null, sid:null, presTimer:null, onlineTimer:null, banExpiryTimer:null,
  msgsCount:0, isAdmin:false, replyTo:null, mentionStart:-1,
  notifOn:false, notifReady:false, hasSent:false };

// ===== UTILS =====
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function safeIcons(){ try{ if(window.lucide&&lucide.createIcons) lucide.createIcons(); }catch(e){} }
function tAgo(date){
  const d=Math.floor((Date.now()-date.getTime())/1000);
  if(d<0||d<45) return 'recién';
  if(d<3600) return 'hace '+Math.floor(d/60)+' min';
  if(d<86400) return 'hace '+Math.floor(d/3600)+' h';
  return 'hace '+Math.floor(d/86400)+' d';
}
function msgDate(x){ const v=x&&x.timestamp; if(v&&v.toDate) return v.toDate(); if(v&&typeof v.seconds==='number') return new Date(v.seconds*1000); return new Date(); }
function showToast(msg,type,ms){
  const c=document.getElementById('toast-c'),t=document.createElement('div');
  t.className='toast'; t.style.borderLeftColor=type==='r'?'#ef4444':'#22c55e';
  t.innerHTML='<i data-lucide="'+(type==='r'?'alert-circle':'check-circle')+'" style="width:16px;height:16px;color:'+(type==='r'?'#ef4444':'#22c55e')+'"></i> '+esc(msg);
  c.appendChild(t); safeIcons(); setTimeout(()=>t.remove(), ms||4000);
}

// ===== APODO (compartido con foro/comentarios: localStorage rmdp_apodo) =====
const APODO_LS='rmdp_apodo';
function isReservedName(s){
  const n=String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  return !!n && (n.indexOf('admin')>=0||n.indexOf('robosmdp')>=0||n.indexOf('verificad')>=0||n.indexOf('oficial')>=0||n.indexOf('moderador')>=0);
}
function getApodo(){ try{ return (localStorage.getItem(APODO_LS)||'').trim(); }catch(e){ return ''; } }
function setApodo(n){ n=String(n||'').trim().slice(0,40); if(isReservedName(n)) return; try{ localStorage.setItem(APODO_LS,n); }catch(e){} }
function promptApodo(initial){
  for(let i=0;i<4;i++){
    const a=(window.prompt(i===0?'¿Cómo querés que te llamen en el chat?':'Ese apodo está reservado para el administrador. Elegí otro:',initial||'')||'').trim().slice(0,40);
    if(!a) return '';
    if(isReservedName(a)){ showToast('Este apodo está reservado para el administrador. Elegí otro apodo.','r'); initial=''; continue; }
    return a;
  }

}
function ensureApodo(){ let a=getApodo(); if(!a){ a=promptApodo(''); if(a){ setApodo(a); onApodoChanged(); } } return a||''; }

function chatAvatar(name,size){ size=size||36; const n=(String(name||'').trim())||'?'; const ini=n.charAt(0).toUpperCase(); return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+chatColor(n)+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:'+Math.round(size*.42)+'px;flex-shrink:0;font-family:\'Space Grotesk\',sans-serif;line-height:1">'+esc(ini)+'</div>'; }

// ===== MENSAJES (tiempo real) =====
let _cache=[]; // docs ordenados asc
function nearBottom(){ const el=document.getElementById('chat-msgs'); if(!el) return true; return (el.scrollHeight-el.scrollTop-el.clientHeight)<120; }
function scrollBottom(){ const el=document.getElementById('chat-msgs'); if(el) el.scrollTop=el.scrollHeight; }
function subscribeMessages(){
  if(!G.authReady || !G.banReady || G.banned) return;   // baneado/no verificado: NO recibe mensajes
  if(G.msgsUnsub){ try{G.msgsUnsub();}catch(e){} }
  G.notifReady=false; // no notificar en la carga inicial (ni al recargar más mensajes)
  try{
    G.msgsUnsub=db.collection(CHAT_COL).orderBy('timestamp','desc').limit(G.limit).onSnapshot(snap=>{
      // Notificar mensajes realmente nuevos (no la carga inicial, no los propios optimistas)
      if(G.notifReady){
        snap.docChanges().forEach(ch=>{
          if(ch.type!=='added') return;
          if(ch.doc.metadata && ch.doc.metadata.hasPendingWrites) return;
          onIncomingMessage(ch.doc.data());
        });
      }
      const stick=nearBottom();
      const grew=snap.size>G.msgsCount;
      G.msgsCount=snap.size;
      _cache=snap.docs.map(d=>({id:d.id,...d.data()})).reverse();
      const lm=document.getElementById('chat-loadmore'); if(lm) lm.style.display=(snap.size>=G.limit)?'block':'none';
      renderMessages(stick||grew);
      G.notifReady=true;
    },err=>{ console.warn('chat msgs',err); });
  }catch(e){ console.warn('subscribeMessages',e); }
}
function loadMoreMsgs(){ G.limit+=CHAT_PAGE; subscribeMessages(); }
function renderFromCache(){ renderMessages(false); }
// Resalta menciones @apodo (solo visual). Se aplica sobre el texto ya escapado.
function highlightMentions(escaped){
  try{ return escaped.replace(/(^|\s)@([\p{L}\p{N}_.-]{1,30})/gu,'$1<span class="mention">@$2</span>'); }
  catch(e){ return escaped.replace(/(^|\s)@([A-Za-z0-9_.-]{1,30})/g,'$1<span class="mention">@$2</span>'); }
}
function renderText(t){ return highlightMentions(esc(t)); }
function renderMessages(doScroll){
  if(G.banned) return;  // nunca pintar historial a un usuario suspendido
  const el=document.getElementById('chat-msgs'); if(!el) return;
  const empty=document.getElementById('chat-empty');
  const me=getApodo();
  // limpiar solo las burbujas (conservar loadmore + empty)
  [...el.querySelectorAll('.cmsg')].forEach(n=>n.remove());
  if(empty) empty.style.display=_cache.length?'none':'block';
  const frag=document.createDocumentFragment();
  _cache.forEach(m=>{
    const mine=!!me && m.apodo===me;
    const d=msgDate(m);
    const isMod=!!m.moderador || (!!m.uid && G.mods.has(m.uid));
    const isAdm=!!m.admin;
    const badge=isAdm?'<span class="badge badge-admin">✓ AdminRobos</span>':(isMod?'<span class="badge badge-mod">🛡️ Mod</span>':'');
    const modActions = G.isAdmin ? ('<div class="mod-actions">'+
      '<button class="mod-btn mod-del" onclick="adminDeleteMsgInline(\''+m.id+'\')" title="Eliminar mensaje">🗑️</button>'+
      (isAdm?'':'<button class="mod-btn mod-ban" onclick="adminBanInline(\''+encodeURIComponent(m.uid||'')+'\',\''+encodeURIComponent(m.apodo||'')+'\')" title="Banear a este usuario">🚫</button>')+
      '</div>') : '';
    // Cita (respuesta a otro mensaje)
    let quote='';
    if(m.replyTo && (m.replyTo.msgId || m.replyTo.apodo)){
      const origLoaded=_cache.some(x=>x.id===m.replyTo.msgId);
      const qt=esc(m.replyTo.texto||'');
      const body=origLoaded ? (qt||'<span class="cq-del">(sin texto)</span>')
                            : (qt?('<span class="cq-del">'+qt+'</span>'):'<span class="cq-del">Mensaje eliminado</span>');
      quote='<div class="cquote" onclick="scrollToReply(\''+esc(m.replyTo.msgId||'')+'\')">'+
        '<div class="cq-name">↩️ @'+esc(m.replyTo.apodo||'alguien')+(origLoaded?'':' · <span class="cq-del">eliminado</span>')+'</div>'+
        '<div class="cq-text">'+body+'</div></div>';
    }
    const div=document.createElement('div');
    div.className='cmsg'+(mine?' mine':'');
    div.dataset.mid=m.id;
    div.innerHTML=chatAvatar(m.apodo,34)+
      '<div class="cbubble">'+
      '<div class="cname" style="color:'+chatColor(m.apodo||'?')+'">'+esc(m.apodo||'Vecino anónimo')+badge+'</div>'+
      quote+
      '<div class="ctext">'+renderText(m.texto||'')+'</div>'+
      '<div class="ctime">'+tAgo(d)+'</div>'+
      modActions+
      '</div>'+
      '<button class="reply-btn" onclick="setReply(\''+m.id+'\')" title="Responder" aria-label="Responder">↩️</button>';
    frag.appendChild(div);
  });
  const empt=document.getElementById('chat-empty');
  el.insertBefore(frag, empt?empt.nextSibling:null);
  if(doScroll) requestAnimationFrame(scrollBottom);
}

// ===== PRESENCIA / EN LÍNEA =====
function getSid(){
  if(G.sid) return G.sid;
  try{ G.sid=sessionStorage.getItem('rmdp_chat_sid'); }catch(e){}
  if(!G.sid){ G.sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('s'+Date.now()+Math.random().toString(16).slice(2)); try{ sessionStorage.setItem('rmdp_chat_sid',G.sid); }catch(e){} }
  return G.sid;
}
function pushPresence(){
  if(!db || !auth || !auth.currentUser || G.banned || !G.authReady || !G.banReady) return;
  const a=getApodo(); if(!a) return;
  try{ db.collection(PRES_COL).doc(getSid()).set({uid:auth.currentUser.uid,apodo:a,ultimo_ping:FV.serverTimestamp(),activo:true},{merge:true}).catch(()=>{}); }catch(e){}
}
function stopPresence(){
  if(G.presTimer){ clearInterval(G.presTimer); G.presTimer=null; }
  try{ if(db && G.sid) db.collection(PRES_COL).doc(G.sid).update({activo:false}).catch(()=>{}); }catch(e){}
}
function startPresence(){
  if(G.presTimer || G.banned || !G.banReady || !G.authReady) return;
  pushPresence();
  G.presTimer=setInterval(pushPresence,30000);
}
let _presDocs=[];
function presTime(x){ const v=x&&x.ultimo_ping; if(v&&v.toDate) return v.toDate().getTime(); if(v&&typeof v.seconds==='number') return v.seconds*1000; return 0; }
function recomputeOnline(){
  const now=Date.now();
  const seen=new Set();
  let n=0;
  // Dedupe por UID (una identidad = un conectado, aunque tenga varias pestañas/sesiones).
  _presDocs.forEach(p=>{ if(p.activo===false) return; if((now-presTime(p))>ONLINE_TTL) return; const key=p.uid||p.apodo||p._id; if(seen.has(key)) return; seen.add(key); n++; });
  const el=document.getElementById('chat-online'); if(el) el.textContent=n+' '+(n===1?'vecino':'vecinos')+' en línea';
}
function subscribeOnline(){
  if(G.banned || !G.banReady || G.presUnsub) return;
  try{
    G.presUnsub=db.collection(PRES_COL).onSnapshot(snap=>{ _presDocs=snap.docs.map(d=>({_id:d.id,...d.data()})); recomputeOnline(); },err=>{ console.warn('presencia',err); });
  }catch(e){ console.warn('subscribeOnline',e); }
  if(!G.onlineTimer) G.onlineTimer=setInterval(recomputeOnline,15000);
}

// ===== MODERADORES (indexados por UID: chat_moderadores/{uid}) =====
function subscribeMods(){
  if(!G.authReady || !G.banReady || G.banned || G.modUnsub) return;
  try{
    G.modUnsub=db.collection(MOD_COL).onSnapshot(snap=>{ G.mods=new Set(snap.docs.map(d=>d.id)); renderFromCache(); },err=>{ console.warn('mods',err); });

// ===== BANS POR UID DE FIREBASE =====
function banTime(h){ if(h==null) return null; return (h&&h.toDate)?h.toDate().getTime():(h&&typeof h.seconds==='number'?h.seconds*1000:null); }
function banActive(d){ if(!d) return false; const h=d.ban_hasta; if(h==null) return true; const t=banTime(h); return t!=null && t>Date.now(); }
function fmtBanUntil(d){ const h=d&&d.ban_hasta; if(h==null) return 'de forma indefinida'; const t=banTime(h); if(t==null) return 'de forma indefinida'; const dt=new Date(t); return 'hasta el '+dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' a las '+dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' hs'; }
// Corta TODO lo que recibe un usuario (mensajes, presencia, mods) y limpia el historial en pantalla.
function stopChatListeners(){
  ['msgsUnsub','presUnsub','modUnsub'].forEach(k=>{ if(G[k]){ try{ G[k](); }catch(e){} G[k]=null; } });
  if(G.onlineTimer){ clearInterval(G.onlineTimer); G.onlineTimer=null; }
  _cache=[]; _presDocs=[]; G.mods=new Set(); G.notifReady=false; G.msgsCount=0;
  document.querySelectorAll('#chat-msgs .cmsg').forEach(el=>el.remove());
}
function showStatusScreen(mode,title,desc,metaHTML){
  const lock=document.getElementById('chat-lockout'), msgs=document.getElementById('chat-msgs'), footer=document.getElementById('chat-footer');
  const spin=document.getElementById('lk-spin'), emoji=document.getElementById('lk-emoji');
  const tEl=document.getElementById('chat-lockout-title'), dEl=document.getElementById('chat-lockout-desc'), mEl=document.getElementById('chat-lockout-meta');
  if(!lock) return;
  if(mode==='open'){ lock.style.display='none'; if(msgs)msgs.style.display='block'; if(footer)footer.style.display='block'; return; }
  lock.style.display='flex';
  lock.classList.toggle('suspended', mode==='suspended');
  if(spin) spin.style.display=(mode==='loading')?'block':'none';
  if(emoji){ emoji.style.display=(mode==='loading')?'none':'block'; emoji.textContent=(mode==='error')?'⚠️':'🚫'; }
  if(tEl) tEl.textContent=title;
  if(dEl) dEl.textContent=desc;
  if(mEl){ mEl.innerHTML=metaHTML||''; mEl.style.display=metaHTML?'flex':'none'; }
  if(msgs) msgs.style.display='none';
  if(footer) footer.style.display='none';
}
function applyBanUI(d){
  G.banReady=true;
  const banned=banActive(d) && !G.isAdmin;   // el administrador nunca queda bloqueado
  const was=G.banned;
  G.banned=banned;
  if(G.banExpiryTimer){ clearTimeout(G.banExpiryTimer); G.banExpiryTimer=null; }
  if(banned){
    stopPresence();
    stopChatListeners();
    const meta='<div class="lk-row"><b>Duración</b><span>'+esc(fmtBanUntil(d))+'</span></div>'+
      ((d&&d.motivo)?'<div class="lk-row"><b>Motivo</b><span>'+esc(d.motivo)+'</span></div>':'')+
      '<p class="lk-note">Cambiar de apodo, recargar la página o abrir otra pestaña no modifica esta suspensión. El acceso se restablece automáticamente cuando termina.</p>';
    showStatusScreen('suspended','🚫 Acceso al chat suspendido',
      'Tu acceso al Chat Vecinal de Robos MDP ha sido suspendido. No podés leer ni enviar mensajes.', meta);
    // Programar restablecimiento automático al vencer una sanción temporal.
    const t=d?banTime(d.ban_hasta):null;
    if(t!=null && t>Date.now()){
      G.banExpiryTimer=setTimeout(()=>applyBanUI(d), Math.min(t-Date.now()+200, 2147483000));
    }
  }else{
    showStatusScreen('open');
    // (Re)iniciar suscripciones al recuperar acceso o al verificar que no hay ban.
    subscribeMessages(); subscribeOnline(); subscribeMods(); startPresence();
    if(was) refreshApodoLabels();
  }
}
function subscribeBan(){
  if(G.banUnsub){ try{G.banUnsub();}catch(e){} G.banUnsub=null; }
  G.banned=true; G.banReady=false;
  if(!auth || !auth.currentUser) return;
  try{
    G.banUnsub=db.collection(BAN_COL).doc(auth.currentUser.uid).onSnapshot(
      snap=>applyBanUI(snap.exists?snap.data():null),
      err=>{ // fail-closed: si no se puede verificar el ban, no se abre el chat
        console.error('ban',err); G.banned=true; G.banReady=false;
        stopPresence(); stopChatListeners();
        showStatusScreen('error','No se pudo verificar tu acceso',
          'Hubo un problema al comprobar el estado de tu acceso al chat. Volvé a intentarlo en unos minutos.');
      });
  }catch(e){ console.warn('subscribeBan',e); }
}

// ===== ENVÍO + ANTI-SPAM =====
function onChatInput(){
  const ta=document.getElementById('chat-in'), c=document.getElementById('chat-count');
  if(!ta) return;
  ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  if(c){ const n=ta.value.length; c.textContent=n+' / '+CHAT_MAX_LEN; c.classList.toggle('over',n>=CHAT_MAX_LEN); }
  checkMention();
}
function mentionOpen(){ const dd=document.getElementById('mention-dd'); return !!dd && dd.style.display==='block'; }
function onChatKey(e){
  if(mentionOpen()){
    const dd=document.getElementById('mention-dd');
    if(e.key==='Enter'||e.key==='Tab'){ const sel=dd.querySelector('.md-item.sel')||dd.querySelector('.md-item'); if(sel){ e.preventDefault(); sel.click(); return; } }
    if(e.key==='Escape'){ e.preventDefault(); dd.style.display='none'; return; }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); moveMentionSel(e.key==='ArrowDown'?1:-1); return; }
  }
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); }
}
async function sendChat(){
  if(!db) return;
  const ta=document.getElementById('chat-in'); if(!ta) return;
  const txt=ta.value.trim();
  if(!txt) return;
  const a=ensureApodo(); if(!a){ showToast('Elegí un apodo para escribir','r'); return; }
  if(G.banned || !G.authReady || !G.banReady || !auth || !auth.currentUser){ showToast('Tu acceso al chat no está habilitado','r'); return; }
  const now=Date.now();
  // cooldown 3s
  if(now-G.lastSend<COOLDOWN_MS){ showToast('Esperá un segundo entre mensajes','r'); return; }
  // rate: máx 10 en 60s
  G.sendTimes=G.sendTimes.filter(t=>now-t<RATE_WIN_MS);
  if(G.sendTimes.length>=RATE_MAX){ showToast('Demasiados mensajes, esperá un momento','r'); return; }
  const snd=document.getElementById('chat-send'); if(snd) snd.disabled=true;
  const payload={
    uid:auth.currentUser.uid, apodo:a, texto:txt.slice(0,CHAT_MAX_LEN),
    admin:G.isAdmin===true, moderador:G.mods.has(auth.currentUser.uid),
    timestamp:FV.serverTimestamp()
  };
  if(G.replyTo && G.replyTo.msgId){
    payload.replyTo={ msgId:G.replyTo.msgId, apodo:String(G.replyTo.apodo||'').slice(0,40), texto:String(G.replyTo.texto||'').slice(0,80) };
  }
  try{
    await db.collection(CHAT_COL).add(payload);
    G.lastSend=now; G.sendTimes.push(now);
    ta.value=''; clearReply(); onChatInput(); ta.focus();
    requestAnimationFrame(scrollBottom);
    G.hasSent=true; maybeAskNotif();   // recién tras escribir al menos 1 mensaje
  }catch(e){ console.error('sendChat',e); showToast('No se pudo enviar (¿reglas Firestore?)','r'); }
  finally{ if(snd) snd.disabled=G.banned; }
}

// ===== RESPONDER A UN MENSAJE =====
function setReply(id){

function clearReply(){ G.replyTo=null; const pv=document.getElementById('reply-preview'); if(pv) pv.style.display='none'; }
function scrollToReply(id){

// ===== MENCIONES (@apodo) =====
function activeApodos(){
  const now=Date.now(), seen=new Set(), out=[];
  _presDocs.slice().sort((a,b)=>presTime(b)-presTime(a)).forEach(p=>{
    if(p.activo===false) return; if((now-presTime(p))>ONLINE_TTL) return;
    const a=p.apodo; if(!a||seen.has(a)) return; seen.add(a); out.push(a);
  });
  return out;
}
function checkMention(){
  const ta=document.getElementById('chat-in'), dd=document.getElementById('mention-dd');
  if(!ta||!dd) return;
  const pos=ta.selectionStart||0;
  const m=ta.value.slice(0,pos).match(/(?:^|\s)@([^\s@]{0,30})$/);
  if(!m){ dd.style.display='none'; G.mentionStart=-1; return; }
  G.mentionStart=pos-m[1].length-1;
  const q=m[1].toLowerCase(), self=(getApodo()||'').toLowerCase();
  let list=activeApodos().filter(a=>a.toLowerCase()!==self);
  if(q) list=list.filter(a=>a.toLowerCase().includes(q));
  list=list.slice(0,6);
  if(!list.length){ dd.style.display='none'; return; }
  dd.innerHTML=list.map((a,i)=>'<div class="md-item'+(i===0?' sel':'')+'" onclick="pickMention(\''+encodeURIComponent(a)+'\')">'+chatAvatar(a,22)+'<span>'+esc(a)+'</span></div>').join('');
  dd.style.display='block'; safeIcons();
}
function moveMentionSel(dir){
  const dd=document.getElementById('mention-dd'); if(!dd) return;
  const items=[...dd.querySelectorAll('.md-item')]; if(!items.length) return;
  let i=items.findIndex(x=>x.classList.contains('sel')); items.forEach(x=>x.classList.remove('sel'));
  i=(i+dir+items.length)%items.length; items[i].classList.add('sel'); items[i].scrollIntoView({block:'nearest'});
}
function pickMention(encA){
  const a=decodeURIComponent(encA); const ta=document.getElementById('chat-in'); if(!ta) return;
  const pos=ta.selectionStart||ta.value.length;
  const start=(G.mentionStart>=0)?G.mentionStart:pos;
  const before=ta.value.slice(0,start), after=ta.value.slice(pos);
  const insert='@'+a+' ';
  ta.value=before+insert+after;
  const np=(before+insert).length; try{ ta.setSelectionRange(np,np); }catch(e){}
  const dd=document.getElementById('mention-dd'); if(dd) dd.style.display='none';
  G.mentionStart=-1; ta.focus(); onChatInput();
}

// ===== NOTIFICACIONES DE MENSAJES NUEVOS =====
const NOTIF_LS='rmdp_chat_notif', NOTIF_ON_LS='rmdp_chat_notif_on';
const NOTIF_BLOCKED_MSG='🔒 Las notificaciones están bloqueadas. Para activarlas: clic en el candado 🔒 de la barra de direcciones → Notificaciones → Permitir. En Windows: Configuración → Sistema → Notificaciones → activá Google Chrome.';
function notifSupported(){ return ('Notification' in window); }
function notifEnabled(){ return notifSupported() && Notification.permission==='granted' && G.notifOn; }
// 🔔/🔕 refleja el master G.notifOn (el sonido no necesita permiso; la notif del sistema sí).
function updateNotifToggle(){
  const b=document.getElementById('chat-notif-btn'); if(!b) return;
  b.textContent=G.notifOn?'🔔':'🔕';
  b.title=G.notifOn?'Alertas activadas — tocá para silenciar':'Alertas silenciadas — tocá para activar';
}
// --- Sonido propio (Web Audio API), NO requiere permiso del navegador ---
let _audioCtx=null;
function ensureAudio(){ try{ if(!_audioCtx) _audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(_audioCtx.state==='suspended') _audioCtx.resume().catch(()=>{}); }catch(e){} return _audioCtx; }
function playNotifSound(){
  try{
    const ctx=ensureAudio(); if(!ctx) return;
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; osc.type='sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.4);
  }catch(e){}
}
// Mensaje entrante de OTRO usuario: suena siempre (si alertas on, visible u oculto); notif del sistema solo si la pestaña está oculta.
function onIncomingMessage(m){
  if(!m) return;
  const me=(getApodo()||'').toLowerCase();
  if((m.apodo||'').toLowerCase()===me) return;   // nunca los propios
  if(G.notifOn) playNotifSound();                // sonido independiente de la visibilidad
  if(document.hidden) maybeNotify(m);            // notif del sistema solo si no está mirando
}
// Se pide permiso SOLO tras el primer mensaje enviado y SOLO si nunca se decidió (y si las alertas están on).
function maybeAskNotif(){
  if(!notifSupported()||!G.hasSent||!G.notifOn) return;
  if(Notification.permission!=='default'){ try{ localStorage.setItem(NOTIF_LS,Notification.permission); }catch(e){} updateNotifToggle(); return; }
  let asked=null; try{ asked=localStorage.getItem(NOTIF_LS); }catch(e){}
  if(asked) return;
  try{ Notification.requestPermission().then(p=>{ try{ localStorage.setItem(NOTIF_LS,p); }catch(e){} updateNotifToggle(); }).catch(()=>{}); }catch(e){}
}
// Toggle manual del header (controla sonido + notif del sistema).
function toggleNotif(){
  G.notifOn=!G.notifOn;
  try{ localStorage.setItem(NOTIF_ON_LS, G.notifOn?'1':'0'); }catch(e){}
  if(G.notifOn){
    ensureAudio();  // desbloquear el audio con este gesto del usuario
    showToast('Alertas activadas 🔔','g');
    if(notifSupported()){
      if(Notification.permission==='denied'){ showToast(NOTIF_BLOCKED_MSG,'r',11000); }
      else if(Notification.permission==='default'){
        try{ Notification.requestPermission().then(p=>{ try{ localStorage.setItem(NOTIF_LS,p); }catch(e){} if(p==='denied') showToast(NOTIF_BLOCKED_MSG,'r',11000); updateNotifToggle(); }).catch(()=>{}); }catch(e){}
      }
    }
  }else{
    showToast('Alertas silenciadas 🔕','g');
  }
  updateNotifToggle();
}
// Notificación del sistema — new Notification() DIRECTO (no via Service Worker; la pestaña está abierta cuando se usa).
function maybeNotify(m){
  try{
    if(!m||!notifEnabled()) return;
    if(!document.hidden) return;                                   // el usuario está mirando el chat
    const me=(getApodo()||'').toLowerCase();
    if((m.apodo||'').toLowerCase()===me) return;                   // no notificar mis propios mensajes
    const body='@'+(m.apodo||'Vecino')+': '+String(m.texto||'').slice(0,60);
    const n=new Notification('💬 Robos MDP Chat',{ body:body, icon:'/assets/logo-robos.png', tag:'rmdp-chat', renotify:true });
    n.onclick=()=>{ try{ window.focus(); }catch(e){} try{ n.close(); }catch(e){} };
  }catch(e){ console.warn('notify',e); }
}

// ===== LOGIN ADMIN =====
function openAdminLogin(){
  if(G.isAdmin){ adminLogout(); return; }
  if(!auth){ showToast('Login no disponible','r'); return; }
  const e=document.getElementById('admin-login-err'); if(e) e.style.display='none';
  const p=document.getElementById('admin-pass'); if(p) p.value='';
  const m=document.getElementById('admin-login-m'); if(m) m.style.display='flex';
  if(p) setTimeout(()=>p.focus(),60);
}
function closeAdminLogin(){ const m=document.getElementById('admin-login-m'); if(m) m.style.display='none'; }
async function doAdminLogin(){
  if(!auth) return;
  const email=(document.getElementById('admin-email')?.value||'').trim();
  const pass=document.getElementById('admin-pass')?.value||'';
  const errEl=document.getElementById('admin-login-err'), btn=document.getElementById('admin-login-btn');
  const showErr=m=>{ if(errEl){ errEl.textContent=m; errEl.style.display='block'; } };
  if(!email||!pass){ showErr('Completá email y contraseña.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='Ingresando...'; }
  try{
    const cred=await auth.signInWithEmailAndPassword(email,pass);
    if(cred.user && cred.user.email===ADMIN_EMAIL){
      closeAdminLogin(); showToast('Sesión de administrador iniciada ✓','g');
      // setAdminMode lo dispara onAuthStateChanged
    }else{
      await auth.signOut(); showErr('Esa cuenta no es la de administrador.');
    }
  }catch(e){ console.warn('login',e); showErr('No se pudo iniciar sesión. Revisá los datos.'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Ingresar'; } }
}
async function adminLogout(){ try{ if(auth) await auth.signOut(); }catch(e){} showToast('Sesión de administrador cerrada','g'); }
// Fuente única de verdad del estado admin: el observer de Firebase Auth.
function setAdminMode(on){
  G.isAdmin=!!on;
  const btn=document.getElementById('chat-admin-btn');
  if(on){
    try{ localStorage.setItem(APODO_LS,'AdminRobos'); }catch(e){}
    if(btn){ btn.textContent='✓ Admin'; btn.classList.add('is-admin'); btn.title='Sesión admin activa — tocá para cerrar sesión'; }
  }else{
    // al salir, soltar el apodo reservado para no quedar bloqueado por las reglas
    try{ if((getApodo()||'').toLowerCase()==='adminrobos') localStorage.removeItem(APODO_LS); }catch(e){}
    if(btn){ btn.textContent='🔐 Login admin'; btn.classList.remove('is-admin'); btn.title='Acceso administrador'; }
  }
  onApodoChanged();
}
// ===== MODERACIÓN INLINE (solo admin autenticado; las reglas exigen isAdmin()) =====
async function adminDeleteMsgInline(id){
  if(!G.isAdmin||!id) return;
  if(!confirm('¿Eliminar este mensaje?')) return;
  try{ await db.collection(CHAT_COL).doc(id).delete(); }
  catch(e){ console.error('del inline',e); showToast('No se pudo eliminar','r'); }
}
function adminBanInline(encUid,encA){
  if(!G.isAdmin) return;
  const uid=decodeURIComponent(encUid||''), a=decodeURIComponent(encA||'');
  if(!uid){ showToast('Mensaje antiguo sin UID: no se puede aplicar un ban persistente desde este mensaje. Usá el panel admin.','r',7000); return; }
  if(a==='AdminRobos' || (auth&&auth.currentUser&&uid===auth.currentUser.uid)) return;
  const prev=document.getElementById('chat-ban-modal'); if(prev) prev.remove();
  const ov=document.createElement('div'); ov.className='movl'; ov.id='chat-ban-modal'; ov.style.display='flex';
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const opts=[['1 hora',3600e3],['6 horas',6*3600e3],['24 horas',24*3600e3],['7 días',7*24*3600e3],['30 días',30*24*3600e3],['Indefinido',null]];
  ov.innerHTML='<div class="mbox">'+
    '<p style="font-size:15px;font-weight:800;color:var(--t0);margin-bottom:3px">🚫 Banear a "'+esc(a)+'"</p>'+
    '<p style="font-size:11px;color:var(--t3);margin-bottom:13px">Elegí la duración del ban.</p>'+
    '<div id="chat-ban-dur" style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px">'+opts.map((o,i)=>'<button data-ms="'+(o[1]==null?'null':o[1])+'" onclick="banInlinePick(this)" style="padding:9px 5px;border-radius:11px;border:1px solid '+(i===2?'#0ea5e9':'rgba(var(--rgb-line),.2)')+';background:'+(i===2?'rgba(14,165,233,.16)':'rgba(var(--rgb-deep),.6)')+';color:'+(i===2?'#7dd3fc':'var(--t2)')+';font-size:11px;font-weight:700;cursor:pointer">'+o[0]+'</button>').join('')+'</div>'+
    '<input id="chat-ban-motivo" class="min" maxlength="120" placeholder="Motivo (opcional)">'+
    '<div style="display:flex;gap:9px;margin-top:4px"><button onclick="document.getElementById(\'chat-ban-modal\').remove()" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(var(--rgb-line),.2);background:rgba(var(--rgb-slate),.6);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer">Cancelar</button>'+
    '<button onclick="banInlineConfirm()" style="flex:1;padding:12px;border-radius:12px;border:none;background:#ef4444;color:#fff;font-size:12px;font-weight:700;cursor:pointer">Confirmar ban</button></div>';
  document.body.appendChild(ov);
  ov.dataset.ms=String(24*3600e3); ov.dataset.uid=uid; ov.dataset.apodo=a;
}
function banInlinePick(btn){
  const wrap=document.getElementById('chat-ban-dur'); if(!wrap) return;
  [...wrap.children].forEach(b=>{ b.style.borderColor='rgba(var(--rgb-line),.2)'; b.style.background='rgba(var(--rgb-deep),.6)'; b.style.color='var(--t2)'; });
  btn.style.borderColor='#0ea5e9'; btn.style.background='rgba(14,165,233,.16)'; btn.style.color='#7dd3fc';
  const ov=document.getElementById('chat-ban-modal'); if(ov) ov.dataset.ms=btn.dataset.ms;
}
async function banInlineConfirm(){
  if(!G.isAdmin) return;
  const ov=document.getElementById('chat-ban-modal'); if(!ov) return;
  const uid=ov.dataset.uid, a=ov.dataset.apodo||''; if(!uid) return;
  const ms=ov.dataset.ms; const motivo=(document.getElementById('chat-ban-motivo')?.value||'').trim();
  let ban_hasta=null, dur='indefinido';
  if(ms&&ms!=='null'){ ban_hasta=firebase.firestore.Timestamp.fromDate(new Date(Date.now()+Number(ms))); dur=ms; }
  try{
    await db.collection(BAN_COL).doc(uid).set({uid:uid,apodo:a,motivo:motivo,ban_hasta:ban_hasta,duracion_ms:dur,baneado_por:'AdminRobos',timestamp:FV.serverTimestamp()});
    // Sacarlo YA de los conectados: marcar sus presencias como inactivas.
    try{ const ps=await db.collection(PRES_COL).where('uid','==',uid).get(); await Promise.all(ps.docs.map(p=>p.ref.update({activo:false}).catch(()=>{}))); }catch(_){}
    ov.remove(); showToast('Usuario baneado 🚫','g');
  }catch(e){ console.error('ban inline',e); showToast('No se pudo banear','r'); }
}

// ===== INIT =====
window.addEventListener('load',()=>{
  if(!db){ showToast('Sin conexión a la base','r'); return; }
  if(auth){
    auth.onAuthStateChanged(async u=>{
      if(!u){
        // Sin sesión activa → resetear estado (fail-closed) e ingresar de forma anónima.
        G.authReady=false; G.banReady=false; G.banned=true; G.uid=null;
        stopPresence(); stopChatListeners();
        if(G.banUnsub){ try{G.banUnsub();}catch(e){} G.banUnsub=null; }
        showStatusScreen('loading','Verificando acceso…','Conectando con el chat vecinal de forma segura.');
        try{ await auth.signInAnonymously(); }
        catch(e){ console.error('anon auth',e);
          showStatusScreen('error','No se pudo iniciar el chat',
            'No se pudo conectar de forma anónima. Es necesario habilitar el proveedor «Anonymous» en Firebase Authentication → Sign-in method.'); }
        return;
      }
      // Sesión lista (anónima o admin): verificar identidad y recién ahí comprobar el ban.
      G.uid=u.uid; G.authReady=true; G.banReady=false; G.banned=true;
      setAdminMode(u.email===ADMIN_EMAIL);
      subscribeBan();   // applyBanUI abrirá (o no) las suscripciones según el estado de la sanción
    });
    window.addEventListener('beforeunload',()=>{ try{ if(db&&G.sid) db.collection(PRES_COL).doc(G.sid).update({activo:false}).catch(()=>{}); }catch(e){} });
  }else{
    showStatusScreen('error','Login no disponible','No se pudo inicializar la autenticación del chat.');
  }
  // No se fuerza el prompt de apodo al cargar (evita bloquear y pisar la resolución de auth);
  // se pide al enfocar el input o al enviar. Las suscripciones arrancan tras verificar el ban.
  refreshApodoLabels();
  onChatInput();
  // Alertas ON por defecto (el sonido no necesita permiso); solo off si el user las silenció.
  G.notifOn = (function(){ try{ return localStorage.getItem(NOTIF_ON_LS)!=='0'; }catch(e){ return true; } })();
  updateNotifToggle();
  // Desbloquear el audio (autoplay policy) con el primer gesto del usuario.
  ['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>ensureAudio(),{once:true,passive:true}));
  safeIcons();
  document.getElementById('chat-in')&&document.getElementById('chat-in').addEventListener('focus',()=>{ if(!getApodo()) ensureApodo(); });
  // Long-press en mobile para responder
  (function(){
    const box=document.getElementById('chat-msgs'); if(!box) return;
    let timer=null, tgt=null;
    const clr=()=>{ if(timer){clearTimeout(timer);timer=null;} if(tgt){tgt.classList.remove('lp');tgt=null;} };
    box.addEventListener('touchstart',e=>{
      const cm=e.target.closest&&e.target.closest('.cmsg'); if(!cm||!cm.dataset.mid) return;
      tgt=cm;
      timer=setTimeout(()=>{ timer=null; if(tgt){ tgt.classList.add('lp'); setReply(tgt.dataset.mid); try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){} setTimeout(()=>{ if(cm) cm.classList.remove('lp'); },700); } },450);
    },{passive:true});
    box.addEventListener('touchmove',clr,{passive:true});
    box.addEventListener('touchend',clr,{passive:true});
    box.addEventListener('touchcancel',clr,{passive:true});
    box.addEventListener('scroll',clr,{passive:true});
  })();
  // Cerrar dropdown de menciones al tocar afuera
  document.addEventListener('click',e=>{
    if(e.target.closest&&(e.target.closest('#mention-dd')||e.target.id==='chat-in')) return;
    const dd=document.getElementById('mention-dd'); if(dd) dd.style.display='none';
  });
});
</script>
