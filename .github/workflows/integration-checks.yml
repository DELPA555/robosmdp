name: Integración ROBOS MDP

on:
  pull_request:
  push:
    branches:
      - integration/mejoras-robosmdp-20261018

permissions:
  contents: read

jobs:
  frontend-and-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis
        run: |
          node --check netlify/functions/chat-ip.mjs
          node --check netlify/functions/notify-zone.mjs
          node --check netlify/functions/push-unsubscribe.mjs
          node --check netlify/functions/push-delivery-cleanup.mjs
          node --check scripts/migrate-chat-ip.mjs
          node --check robosmdp/assets/report-tracking.js
          node --check robosmdp/assets/sponsor-admin.mjs
          node --check robosmdp/assets/sponsor-utils.mjs
      - name: Tests integrados, comerciales, reportes y alertas
        run: |
          node --test scripts/integration.test.mjs
          node --test scripts/report-tracking.test.mjs
          node --test scripts/sponsor-utils.test.mjs
          node --test scripts/push-notifications.test.mjs
          node --test scripts/push-delivery-cleanup.test.mjs
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          npm install -g firebase-tools
          npm install --prefix firestore/tests
      - name: Comprobar reglas reales en emulador
        working-directory: firestore/tests
        run: npm test
