name: GPS voluntario del chat

on:
  pull_request:
  push:
    branches:
      - feat/localizador-voluntario-panel-20261018

permissions:
  contents: read

jobs:
  gps-front-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: |
          node --check robosmdp/assets/chat-location.js
          node --check netlify/functions/chat-location-cleanup.mjs
          node --check scripts/chat-location.test.mjs
      - name: Pruebas de consentimiento, admin y caducidad
        run: node --test scripts/chat-location.test.mjs
  gps-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Firebase CLI y pruebas
        run: |
          npm install -g firebase-tools
          npm install --prefix firestore/tests
      - name: Reglas Firestore completas en emulador
        working-directory: firestore/tests
        run: npm test
