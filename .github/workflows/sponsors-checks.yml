name: Verificar panel de sponsors

on:
  pull_request:
  push:
    branches:
      - feat/panel-sponsors-20261018

permissions:
  contents: read

jobs:
  sponsor-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JS del panel
        run: |
          node --check robosmdp/assets/sponsor-utils.mjs
          node --check robosmdp/assets/sponsor-admin.mjs
      - name: Pruebas de validación y cálculo
        run: node --test scripts/sponsor-utils.test.mjs
  firestore-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase CLI y dependencias
        run: |
          npm install -g firebase-tools
          npm install --prefix firestore/tests
      - name: Reglas Firestore en emulador
        working-directory: firestore/tests
        run: npm test
